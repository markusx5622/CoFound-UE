<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoFound UE — Póster Oficial Campus (IG + LinkedIn + Partículas)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #030305;
        display: flex;
        justify-content: center;
        padding: 40px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .slide {
        width: 724px;
        height: 1024px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }

      .base-poster {
        position: absolute;
        inset: 0;
        width: 724px;
        height: 1024px;
        display: block;
        object-fit: cover;
        z-index: 0;
      }

      /* Partículas temáticas de la Landing Page sobre el fondo negro */
      .particles-canvas {
        position: absolute;
        inset: 0;
        width: 724px;
        height: 1024px;
        pointer-events: none;
        mix-blend-mode: lighten;
        z-index: 1;
      }

      /* Tapa únicamente la franja anterior del @cofoundue para sustituirla de forma simétrica */
      .social-patch {
        position: absolute;
        left: 160px;
        top: 974px;
        width: 404px;
        height: 24px;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      .social-row {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #e4e4e7;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.01em;
        line-height: 1;
      }

      .social-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .social-item svg {
        width: 12.5px;
        height: 12.5px;
        display: block;
        flex-shrink: 0;
      }

      .social-sep {
        color: #a1a1aa;
        font-weight: 700;
        font-size: 13px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <section
      class="slide"
      data-name="poster-oficial-campus-linkedin"
      data-width="724"
      data-height="1024"
    >
      <img src="./poster-base.jpg" alt="CoFound UE Poster Base" class="base-poster" />
      <canvas class="particles-canvas"></canvas>

      <div class="social-patch">
        <div class="social-row">
          <span class="social-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
            </svg>
            <span>@cofoundue</span>
          </span>

          <span class="social-sep">·</span>

          <span class="social-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
              <rect x="2" y="9" width="4" height="12" />
              <circle cx="4" cy="4" r="2" />
            </svg>
            <span>@CoFound UE</span>
          </span>
        </div>
      </div>
    </section>

    <script>
      function createRng(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const canvas = document.querySelector(".particles-canvas");
      if (canvas) {
        const w = 724;
        const h = 1024;
        const dpr = 3;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const rand = createRng(2026);
        const density = 145;
        const maxDist = 88;
        const particles = [];

        for (let i = 0; i < density; i++) {
          const isRed = rand() > 0.22;
          particles.push({
            x: rand() * w,
            y: rand() * h,
            r: rand() * 0.85 + 0.5,
            color: isRed
              ? `rgba(230, 0, 0, ${(0.34 + rand() * 0.34).toFixed(2)})`
              : `rgba(255, 255, 255, ${(0.18 + rand() * 0.24).toFixed(2)})`,
          });
        }

        for (let i = 0; i < particles.length; i++) {
          const p1 = particles[i];
          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
            if (dist < maxDist) {
              const alpha = (1 - dist / maxDist) * 0.12;
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
              ctx.lineWidth = 0.55;
              ctx.stroke();
            }
          }
        }

        for (const p of particles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }

        // Mantener completamente limpia la zona del marco y QR blanco para máxima legibilidad
        ctx.clearRect(198, 622, 328, 304);
      }
    </script>
  </body>
</html>
